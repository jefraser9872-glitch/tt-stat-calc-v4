name: Play Whe V4 Auto-Sync & Mobile Dashboard Publisher

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # 10:30 AM AST Draw Window
    - cron: '35,45,55 14 * * 1-6'
    - cron: '5,15 15 * * 1-6'
    # 1:00 PM AST Draw Window
    - cron: '5,15,25,35,45 17 * * 1-6'
    # 4:00 PM AST Draw Window
    - cron: '5,15,25,35,45 20 * * 1-6'
    # 7:00 PM AST Draw Window
    - cron: '5,15,25,35,45 23 * * 1-6'
    # Hourly heartbeat backup
    - cron: '0 * * * *'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 numpy scipy

      - name: 4. Run V4 Multi-Source NLCB Scraper & Generator
        run: |
          python play_whe_ai_engine.py --cloud-sync

      - name: 5. Commit & Push Updated SQLite DB and Live Dashboard
        run: |
          git config --global user.name "PlayWhe-V4-Bot"
          git config --global user.email "bot@playwhe-v4.local"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync NLCB draws & refresh V4 dashboard" && git pull --rebase origin main && git push origin main)
