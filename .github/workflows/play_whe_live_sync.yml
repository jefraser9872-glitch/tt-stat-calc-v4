name: Play Whe V4 Auto-Sync & Mobile Dashboard Publisher

on:
  # Allows you to tap "Run workflow" from the GitHub app on your phone anytime
  workflow_dispatch:

  # Runs automatically whenever you push code changes
  push:
    branches: [ main ]

  # Scheduled around Trinidad Play Whe draws (AST is UTC-4):
  # 10:30 AM AST = 14:30 UTC | 1:00 PM AST = 17:00 UTC | 4:00 PM AST = 20:00 UTC | 7:00 PM AST = 23:00 UTC
  schedule:
    - cron: '35,45,55 14 * * *'
    - cron: '5,15 15 * * *'
    - cron: '5,15,25,35 17 * * *'
    - cron: '5,15,25,35 20 * * *'
    - cron: '5,15,25,35 23 * * *'

permissions:
  contents: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    env:
      TZ: America/Port_of_Spain
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: pip install -r requirements.txt

      - name: 4. Run V4 Multi-Source NLCB Scraper & Generate Mobile Dashboard
        run: python play_whe_ai_engine.py --once --cloud

      - name: 5. Commit & Push Updated SQLite DB and Live HTML Dashboard
        run: |
          git config --global user.name "PlayWhe-V4-Bot"
          git config --global user.email "bot@playwhe-v4.local"
          git add play_whe_archive.db index.html play_whe_live_dashboard.html
          git diff --staged --quiet || git commit -m "Auto-sync NLCB draws & refresh V4 dashboard"
          git push